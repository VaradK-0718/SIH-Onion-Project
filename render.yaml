services:
  - type: web
    name: oniongrade
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/oniongrade.db
      - key: CORS_ORIGINS
        value: ""
    disk:
      name: oniongrade-data
      mountPath: /var/data
      sizeGB: 1
